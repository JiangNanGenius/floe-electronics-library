[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floe-electronics-library"
version = "0.1.0"
description = "Reproducible, source-attributed 2D electronics library data"
requires-python = ">=3.12"
license = {text = "MPL-2.0 (tooling only; data retains upstream licenses)"}

[tool.setuptools.packages.find]
where = ["src"]
