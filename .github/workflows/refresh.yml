name: Refresh and publish 2D libraries
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: electronics-library-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'JiangNanGenius/floe-electronics-library' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.refresh.outputs.publish }}
      tag: ${{ steps.refresh.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate the exact producer before processing upstream data
        run: |
          python -m unittest discover -s tests/normalizers -v
          python -m unittest discover -s tests/pipeline -v
      - name: Resolve approved sources, normalize, verify and prepare immutable data
        id: refresh
        run: python tools/refresh.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.refresh.outputs.publish == 'true'
        with:
          name: electronics-library-release
          path: release/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: electronics-library-release
          path: ${{ runner.temp }}/electronics-library-release
      - name: Verify assets, publish only data and independently read public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publication.py publish "$RUNNER_TEMP/electronics-library-release"
